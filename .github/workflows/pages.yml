name: Collect, read and publish The Present Tense

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Collect a fresh edition of headlines before publishing
        type: boolean
        default: true
      readings:
        description: Ask Claude for a new edition of readings (needs ANTHROPIC_API_KEY)
        type: boolean
        default: true
  schedule:
    - cron: '17 4,10,16,22 * * *'

concurrency:
  group: present-tense
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  edition:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) }}
      WANT_READINGS: ${{ (github.event_name == 'schedule' && vars.GENERATE_READINGS == 'true') || (github.event_name == 'workflow_dispatch' && inputs.readings) }}
    steps:
      - uses: actions/checkout@v4
      - name: Readings once a day on the schedule (the 22:17 UTC run), every time by hand
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" != "22" ]; then
            echo "WANT_READINGS=false" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Anthropic SDK
        run: pip install --quiet anthropic
      - name: Collect headlines
        id: collect
        if: env.REFRESH == 'true'
        continue-on-error: true
        run: |
          mkdir -p work
          python scripts/collect.py --output work/news-candidate.json
      - name: English headlines
        id: translate
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: python scripts/translate.py --input work/news-candidate.json
      - name: Archive the previous edition and adopt the new one
        id: adopt
        if: steps.translate.outcome == 'success'
        run: |
          python scripts/ledger.py --current data/news.json --output /dev/null --archive
          mv work/news-candidate.json data/news.json
          python scripts/ledger.py
      - name: Ask the oracle
        id: oracle
        if: env.WANT_READINGS == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORACLE_MODEL: ${{ vars.ORACLE_MODEL }}
          ORACLE_EFFORT: ${{ vars.ORACLE_EFFORT }}
          ORACLE_MAX_PER_DAY: ${{ vars.ORACLE_MAX_PER_DAY }}
        run: python scripts/oracle.py
      - name: Freeze and validate
        run: |
          python scripts/freeze.py
          python scripts/validate.py
      - name: Commit the edition
        if: env.REFRESH == 'true'
        run: |
          git config user.name "present-tense[bot]"
          git config user.email "present-tense@users.noreply.github.com"
          git add -A -- data
          if ! git diff --cached --quiet; then
            git commit -m "Edition $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
      - name: Build
        run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Summary
        if: always()
        run: |
          {
            echo "Collection: ${{ steps.collect.outcome || 'skipped' }}"
            echo
            echo "English headlines: ${{ steps.translate.outcome || 'skipped' }}"
            echo
            echo "Oracle: ${{ steps.oracle.outcome || 'skipped' }}"
            echo
            echo "A failed step keeps the previous edition. The page shows its own timestamps."
          } >> "$GITHUB_STEP_SUMMARY"
