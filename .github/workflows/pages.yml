name: Collect, read and publish The Present Tense


on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Collect a fresh edition of headlines before publishing
        type: boolean
        default: true
      readings:
        description: Ask Claude for a new edition of narratives (needs ANTHROPIC_API_KEY)
        type: boolean
        default: true
      recover:
        description: Adopt a finished batch by id instead (leave refresh and readings off)
        type: string
        default: ''
      chronicle:
        description: Revise the Chronicle for the current edition even if it has been chronicled
        type: boolean
        default: false
  schedule:
    - cron: '17 4,10,16,22 * * *'

concurrency:
  group: present-tense
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  edition:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) }}
      WANT_READINGS: ${{ (github.event_name == 'schedule' && vars.GENERATE_READINGS == 'true') || (github.event_name == 'workflow_dispatch' && inputs.readings) }}
    steps:
      - uses: actions/checkout@v4
      - name: Readings once a day on the schedule, every time by hand
        # GitHub can start a scheduled run hours late, so the 22:17 run is not matched by its hour. Instead the first
        # scheduled run after twenty hours have passed since the current edition's collection writes the next one.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            age=$(python3 -c "import json,datetime as d; t=json.load(open('data/readings.json')).get('newsGeneratedAt') or json.load(open('data/readings.json'))['generatedAt']; print((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(t.replace('Z','+00:00'))).total_seconds()/3600)")
            echo "The current edition's collection is ${age} hours old"
            if python3 -c "import sys; sys.exit(0 if float('${age}') >= 20 else 1)"; then echo "a new edition is due"; else echo "WANT_READINGS=false" >> "$GITHUB_ENV"; fi
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Anthropic SDK
        run: pip install --quiet anthropic
      - name: Collect headlines
        id: collect
        if: env.REFRESH == 'true'
        continue-on-error: true
        run: |
          mkdir -p work
          python scripts/collect.py --output work/news-candidate.json
      - name: English headlines
        id: translate
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
        run: python scripts/translate.py --input work/news-candidate.json
      - name: Archive the previous edition and adopt the new one
        id: adopt
        if: steps.translate.outcome == 'success'
        run: |
          python scripts/ledger.py --current data/news.json --output /dev/null --archive
          mv work/news-candidate.json data/news.json
          python scripts/ledger.py
      - name: Collect an edition that was still being written
        id: collect-oracle
        if: hashFiles('data/oracle-pending.json') != '' && env.WANT_READINGS != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/oracle.py --collect
      - name: Adopt a finished batch
        if: github.event_name == 'workflow_dispatch' && inputs.recover != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/oracle.py --recover "${{ inputs.recover }}"
      - name: Ask for new narratives (batch, same model at half price)
        id: oracle
        if: env.WANT_READINGS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.recover == '')
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORACLE_MODEL: ${{ vars.ORACLE_MODEL }}
          ORACLE_EFFORT: ${{ vars.ORACLE_EFFORT }}
          ORACLE_MAX_PER_DAY: ${{ vars.ORACLE_MAX_PER_DAY }}
          ORACLE_WAIT_MINUTES: ${{ vars.ORACLE_WAIT_MINUTES }}
        run: python scripts/oracle.py
      - name: Freeze and validate
        run: |
          python scripts/freeze.py
          python scripts/validate.py
          python scripts/archive.py
      - name: What was looked up (Wikipedia, Bluesky, Mastodon)
        continue-on-error: true
        run: python scripts/attention.py
      - name: Revise the Chronicle
        id: chronicle
        continue-on-error: true  # does nothing unless the current edition has not been chronicled yet
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHRONICLE_MODEL: ${{ vars.CHRONICLE_MODEL }}
          CHRONICLE_EFFORT: ${{ vars.CHRONICLE_EFFORT }}
        run: python scripts/chronicle.py ${{ github.event_name == 'workflow_dispatch' && inputs.chronicle && '--force' || '' }}
      - name: Commit the edition
        run: |
          git config user.name "present-tense[bot]"
          git config user.email "present-tense@users.noreply.github.com"
          git add -A -- data
          if ! git diff --cached --quiet; then
            git commit -m "Edition $(date -u +'%Y-%m-%d %H:%M') UTC"
            # commits made by hand while this run was working must not fail it: rebase onto them and retry
            for attempt in 1 2 3; do
              # on a conflict the run's own data files win; they are the newer collection
              git pull --rebase -X theirs origin main && git push && break
              git rebase --abort 2>/dev/null || true
              echo "push attempt $attempt failed; retrying"; sleep 10
            done
          fi
      - name: Build
        run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Summary
        if: always()
        run: |
          {
            echo "Collection: ${{ steps.collect.outcome || 'skipped' }}"
            echo
            echo "English headlines: ${{ steps.translate.outcome || 'skipped' }}"
            echo
            echo "Oracle: ${{ steps.oracle.outcome || steps.collect-oracle.outcome || 'skipped' }}"
            echo
            echo "Chronicle: ${{ steps.chronicle.outcome || 'skipped' }}"
            echo
            echo "A failed step keeps the previous edition. The page shows its own timestamps."
          } >> "$GITHUB_STEP_SUMMARY"
